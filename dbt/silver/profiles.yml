# Silver materialises into the LAKEHOUSE, over Livy.
#
# The Airflow worker holds no Spark session: dbt-fabricspark submits statements
# to the emulator's Livy surface, the emulator drives its statement agent, and
# Sail executes. Every value here is env-driven, so production points the same
# profile at real Fabric and no model changes.
# EVERY env_var HAS A DEFAULT, and that is a cosmos requirement rather than
# laziness. Cosmos renders the DAG at PARSE time by running `dbt ls`, which
# parses the project and therefore resolves this profile -- but the bearer is
# minted per RUN, so at parse time it does not exist yet. Without defaults the
# dag-processor fails with `Env var required but not provided:
# 'DBT_ACCESS_TOKEN'` and the DAG never appears at all.
#
# `dbt ls` does not CONNECT, so a placeholder is sufficient for it. The real
# values arrive at execution through the task environment, which is where a
# credential belongs -- baking one into a rendered DAG would put it in the
# metadata database.
contoso_silver:
  target: dev
  outputs:
    dev:
      type: fabricspark
      method: livy
      livy_mode: fabric
      # `int_tests` is the adapter's own name for "the caller supplies a bearer",
      # which is exactly the seam this product uses everywhere else: the token is
      # minted from the target's credential and this file never learns whose.
      authentication: int_tests
      accessToken: "{{ env_var('DBT_ACCESS_TOKEN', 'render-time-placeholder') }}"
      # The placeholder is UNROUTABLE on purpose. It used to carry the local
      # emulator's port, so a run that lost its environment would aim at
      # something that exists on one machine; `.invalid` is reserved by
      # RFC 2606 and can never resolve, so the same mistake fails at connect
      # instead of quietly succeeding against the wrong target.
      endpoint: "{{ env_var('DBT_FABRIC_ENDPOINT', 'https://render-time-placeholder.invalid/v1') }}"
      workspaceid: "{{ env_var('DBT_WORKSPACE_ID', '00000000-0000-0000-0000-000000000000') }}"
      lakehouseid: "{{ env_var('DBT_LAKEHOUSE_ID', '00000000-0000-0000-0000-000000000000') }}"
      lakehouse: "{{ env_var('DBT_LAKEHOUSE_NAME', 'lake') }}"
      schema: "{{ env_var('DBT_LAKEHOUSE_NAME', 'lake') }}"
      # FOUR, not one. Seven of core's eight silver models depend only on
      # sources -- only silver_party refs another -- so dbt can build seven at
      # once, and the emulator does not serialise them: it terminates Livy
      # itself and each statement reaches Sail independently.
      #
      # Measured on fabric-emulator's medallion-dbt-fabricspark example, which
      # runs the same adapter against the same engine: at threads: 1 the models
      # START 26s and 15s apart and the step takes 96.0s; at 4 they start in the
      # SAME SECOND and it takes 45.5s. Simultaneous starts are the evidence --
      # a wall-clock delta from one run could be noise.
      #
      # FOUR is carried over from where it was measured, not tuned here. This
      # graph admits seven in the first wave, so the ceiling is untested, and
      # more threads against ONE Sail engine is contention rather than scaling.
      # The gold profile keeps threads: 1: dbt-fabric over TDS is a different
      # adapter and engine and nothing was measured against it.
      threads: 4
      connect_retries: 3
      connect_timeout: 30
      # REQUIRED by the adapter -- `name` inside spark_config, not at the top
      # level. Its absence is a bare `ValueError: Missing required key: name`
      # from deep in credential parsing, which says nothing about where it
      # belongs. It names the Livy session the emulator creates.
      spark_config:
        name: "contoso-silver"
